[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facematch"
version = "0.1.0"
description = "Fast, pluggable face search engine: give a photo, find the face in your database."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FaceMatch contributors" }]
keywords = ["face-recognition", "face-search", "opencv", "onnx", "fastapi"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7"]
arcface = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "scikit-learn>=1.4"]

[project.scripts]
facematch = "facematch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
